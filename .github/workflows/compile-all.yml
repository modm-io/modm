name: Compile HAL for all devices

on:
  pull_request:
    types: [labeled, synchronize, reopened]

# Every added label starts its own run, so give unrelated labels their own group,
# otherwise they cancel the ci:hal run. Pushes to a labeled PR restart the ci:hal run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.action == 'labeled' && github.event.label.name || 'ci:hal' }}
  cancel-in-progress: true

jobs:
  compile-all:
    if: github.event.action == 'labeled' && github.event.label.name == 'ci:hal' || github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'ci:hal')
    name: ${{ matrix.name }}-compile-all
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/modm-ext/modm-build-${{ matrix.image || 'cortex-m' }}:2026-09-28
    strategy:
      fail-fast: false
      # Only 20 runners at a time and GitHub picks the order, so keep every job
      # below ~25 min to avoid a long tail. Longest families first.
      matrix:
        include:
          - {name: stm32h7-1, devices: stm32h7, split: 6, part: 0}
          - {name: stm32h7-2, devices: stm32h7, split: 6, part: 1}
          - {name: stm32h7-3, devices: stm32h7, split: 6, part: 2}
          - {name: stm32h7-4, devices: stm32h7, split: 6, part: 3}
          - {name: stm32h7-5, devices: stm32h7, split: 6, part: 4}
          - {name: stm32h7-6, devices: stm32h7, split: 6, part: 5}
          - {name: stm32f4-1, devices: stm32f4, split: 5, part: 0}
          - {name: stm32f4-2, devices: stm32f4, split: 5, part: 1}
          - {name: stm32f4-3, devices: stm32f4, split: 5, part: 2}
          - {name: stm32f4-4, devices: stm32f4, split: 5, part: 3}
          - {name: stm32f4-5, devices: stm32f4, split: 5, part: 4}
          - {name: stm32g0-1, devices: stm32g0, split: 4, part: 0}
          - {name: stm32g0-2, devices: stm32g0, split: 4, part: 1}
          - {name: stm32g0-3, devices: stm32g0, split: 4, part: 2}
          - {name: stm32g0-4, devices: stm32g0, split: 4, part: 3}
          - {name: stm32g4-1, devices: stm32g4, split: 4, part: 0}
          - {name: stm32g4-2, devices: stm32g4, split: 4, part: 1}
          - {name: stm32g4-3, devices: stm32g4, split: 4, part: 2}
          - {name: stm32g4-4, devices: stm32g4, split: 4, part: 3}
          - {name: stm32l4-1, devices: stm32l4, split: 4, part: 0}
          - {name: stm32l4-2, devices: stm32l4, split: 4, part: 1}
          - {name: stm32l4-3, devices: stm32l4, split: 4, part: 2}
          - {name: stm32l4-4, devices: stm32l4, split: 4, part: 3}
          - {name: stm32u5-1, devices: stm32u5, split: 4, part: 0}
          - {name: stm32u5-2, devices: stm32u5, split: 4, part: 1}
          - {name: stm32u5-3, devices: stm32u5, split: 4, part: 2}
          - {name: stm32u5-4, devices: stm32u5, split: 4, part: 3}
          - {name: stm32h5-1, devices: stm32h5, split: 4, part: 0}
          - {name: stm32h5-2, devices: stm32h5, split: 4, part: 1}
          - {name: stm32h5-3, devices: stm32h5, split: 4, part: 2}
          - {name: stm32h5-4, devices: stm32h5, split: 4, part: 3}
          - {name: stm32f7-1, devices: stm32f7, split: 3, part: 0}
          - {name: stm32f7-2, devices: stm32f7, split: 3, part: 1}
          - {name: stm32f7-3, devices: stm32f7, split: 3, part: 2}
          - {name: stm32f1-1, devices: stm32f1, split: 3, part: 0}
          - {name: stm32f1-2, devices: stm32f1, split: 3, part: 1}
          - {name: stm32f1-3, devices: stm32f1, split: 3, part: 2}
          - {name: stm32f3-1, devices: stm32f3, split: 2, part: 0}
          - {name: stm32f3-2, devices: stm32f3, split: 2, part: 1}
          - {name: stm32l1-1, devices: stm32l1, split: 2, part: 0}
          - {name: stm32l1-2, devices: stm32l1, split: 2, part: 1}
          - {name: stm32l0-1, devices: stm32l0, split: 2, part: 0}
          - {name: stm32l0-2, devices: stm32l0, split: 2, part: 1}
          - {name: stm32c0, devices: stm32c0, split: 1, part: 0}
          - {name: stm32f0, devices: stm32f0, split: 1, part: 0}
          - {name: stm32f2, devices: stm32f2, split: 1, part: 0}
          - {name: stm32u0, devices: stm32u0, split: 1, part: 0}
          - {name: stm32l5, devices: stm32l5, split: 1, part: 0}
          - {name: samd0x-d1x-d2x, devices: samd0 samd1 samd2, split: 1, part: 0}
          - {name: samd5x-e5x-g5x, devices: samd5 same5 samg5, split: 1, part: 0}
          - {name: same7x-s7x-v7x, devices: same7 sams7 samv7, split: 1, part: 0}
          - {name: avr, devices: at, split: 1, part: 0, image: avr}
          - {name: nrf, devices: nrf, split: 1, part: 0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Fix Git permission/ownership problem
        run: |
          git config --global --add safe.directory /__w/modm/modm
      - name: Update lbuild
        run: |
          pip3 install --upgrade --upgrade-strategy=eager --break-system-packages modm
      - name: Compile HAL for ${{ matrix.devices }}
        run: |
          (cd test/all && python3 run_all.py ${{ matrix.devices }} --quick-remaining --split ${{ matrix.split }} --part ${{ matrix.part }})
      - name: Upload log artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-compile-all
          path: test/all/log
