name: Run tests on Linux

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unittests-linux-generic:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/modm-ext/modm-build-cortex-m:2026-09-28

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Fix Git permission/ownership problem
        run: |
          git config --global --add safe.directory /__w/modm/modm
      - name: Update lbuild
        run: |
          pip3 install --upgrade --upgrade-strategy=eager --break-system-packages modm
      - name: Install Clang 23
        run: |
          set -eux
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          . /etc/os-release
          codename="${VERSION_CODENAME}"
          echo "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-23 main" | tee /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y clang-23
          update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-23   100
          update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-23 100
      - name: Check environment
        run: |
          env
          locale -a
          python --version  || true
          python3 --version || true
          python3 -c "import os; print(os.cpu_count())"
          which scons
          scons --version
          which g++
          g++ --version
          which clang
          clang --version
          which clang++
          clang++ --version
          which arm-none-eabi-g++
          arm-none-eabi-g++ --version
          which lbuild
          lbuild --version
      - name: Check for Trailing Whitespace
        if: always()
        run: |
          python3 tools/scripts/rm_whitespace.py
      - name: Check for Expired Deprecations
        if: startsWith(github.head_ref, 'release/')
        run: |
          egrep -rI "DEPRECATED?:? +`basename ${{ github.head_ref }}`" . || true
          return $(egrep -rI "DEPRECATED?:? +`basename ${{ github.head_ref }}`" . | wc -l)
      - name: Synchronize Documentation
        if: always()
        run: |
          git checkout .
          python3 tools/scripts/synchronize_docs.py -d
      - name: Synchronize HAL Support Matrix
        if: always()
        run: |
          git checkout .
          python3 tools/scripts/generate_hal_matrix.py -d
      - name: Check Examples
        if: always()
        run: |
          git checkout .
          python3 tools/scripts/examples_check.py
      - name: Hosted Unittests (GCC)
        if: always()
        run: |
          (cd test && make run-hosted-linux)
      - name: Hosted Unittests (Clang)
        if: always()
        run: |
          (cd test && make run-hosted-linux-clang)
      # The remaining ones are compiled by the stm32-unittests job
      - name: Compile STM32 Unittests
        if: always()
        run: |
          for target in f446re f446ze f767zi g474re; do
            (cd test && make compile-nucleo-$target)
          done
      - name: Hosted Examples
        if: always()
        run: |
          (cd examples && ../tools/scripts/examples_compile.py . ../test/integration --target '^hosted')
      - name: Execute Python Scripts
        if: always()
        run: |
          python3 tools/scripts/authors.py --handles --count --shoutout --since 2017-01-01
          python3 tools/xpcc_generator/builder/system_layout.py examples/communication/xpcc/xml/communication.xml -o /tmp
          python3 tools/font_creator/font_export.py tools/font_creator/fonts/all_caps_3x5.font /tmp/all_caps_converted

  stm32-unittests:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/modm-ext/modm-build-cortex-m:2026-09-28
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Fix Git permission/ownership problem
        run: |
          git config --global --add safe.directory /__w/modm/modm
      - name: Update lbuild
        run: |
          pip3 install --upgrade --upgrade-strategy=eager --break-system-packages modm
      # The remaining ones are compiled by the unittests-linux-generic job
      - name: Compile STM32 Unittests
        run: |
          for target in l432kc f091rc_A f091rc_B f103rb_A f103rb_B f401re f411re f429zi h723zg l496zg-p l552ze-q; do
            (cd test && make compile-nucleo-$target)
          done

  cortex-m-examples:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/modm-ext/modm-build-cortex-m:2026-09-28
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Fix Git permission/ownership problem
        run: |
          git config --global --add safe.directory /__w/modm/modm
      - name: Update lbuild
        run: |
          pip3 install --upgrade --upgrade-strategy=eager --break-system-packages modm
      - name: Install protobuf==3.20.1 grpcio-tools (pip)
        run: |
          pip3 install --upgrade --upgrade-strategy=eager --break-system-packages protobuf grpcio-tools
      - name: Examples Cortex-M Part ${{ matrix.part }}
        run: |
          (cd examples && ../tools/scripts/examples_compile.py . ../test/integration --target '^(stm32|sam|rp|nrf)' --split 7 --part ${{ matrix.part }})

  avr-examples:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/modm-ext/modm-build-avr:2026-09-28
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Fix Git permission/ownership problem
        run: |
          git config --global --add safe.directory /__w/modm/modm
      - name: Update lbuild
        run: |
          pip3 install --upgrade --upgrade-strategy=eager --break-system-packages modm
      - name: Check environment
        if: always()
        run: |
          which avr-g++
          avr-g++ --version
      - name: Examples AVR Series
        if: always()
        run: |
          (cd examples && ../tools/scripts/examples_compile.py . ../test/integration --target '^at')
      - name: Compile AVR Unittests AT90CAN
        if: always()
        run: |
          (cd test && make compile-al-avreb-can)
      - name: Compile AVR Unittests Arduino
        if: always()
        run: |
          (cd test && make compile-arduino-uno)
          # D, G, and I overflow FLASH
          (cd test && make \
              compile-arduino-nano_A compile-arduino-nano_B compile-arduino-nano_C \
              compile-arduino-nano_E compile-arduino-nano_F compile-arduino-nano_H)
      - name: Compile AVR Unittests ATmega
        if: always()
        run: |
          (cd test && make compile-mega-2560-pro_A compile-mega-2560-pro_B compile-mega-2560-pro_C compile-mega-2560-pro_D)
      - name: Quick compile HAL for AVR Devices
        if: always()
        run: |
          (cd test/all && python3 run_all.py at --quick)
      - name: Upload log artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hal-compile-quick-avr
          path: test/all/log

  hal-compile-quick:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/modm-ext/modm-build-cortex-m:2026-09-28
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Fix Git permission/ownership problem
        run: |
          git config --global --add safe.directory /__w/modm/modm
      - name: Update lbuild
        run: |
          pip3 install --upgrade --upgrade-strategy=eager --break-system-packages modm
      - name: Quick compile HAL for Cortex-M Part ${{ matrix.part }}
        if: always()
        run: |
          (cd test/all && python3 run_all.py stm32 sam rp nrf --quick --split 7 --part ${{ matrix.part }})
      - name: Upload log artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hal-compile-quick-${{ matrix.part }}
          path: test/all/log

  # Niklas: Running on the old container until I can figure out why the doc generator hangs
  build-docs-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/modm-ext/modm-build-base:2022-09-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Fix Git permission/ownership problem
        run: |
          git config --global --add safe.directory /__w/modm/modm
      - name: Check environment
        run: |
          env
          locale -a
          python --version  || true
          python3 --version || true
          python3 -c "import os; print(os.cpu_count())"
      - name: Update lbuild
        run: |
          pip3 install --upgrade --upgrade-strategy=eager modm
          which lbuild
          lbuild --version
      - name: Install mkdocs mkdocs-material (pip)
        run: |
          pip3 install --upgrade --upgrade-strategy=eager mkdocs mkdocs-material
          mkdocs --version
          pip3 show mkdocs-material
      - name: Test run of docs.modm.io-generator-script
        if: always()
        run: |
          export TERM=xterm-256color
          export COLUMNS=120
          python3 tools/scripts/docs_modm_io_generator.py -t -c -j4 -d
      - name: Upload Doxypress Documentation
        uses: actions/upload-artifact@v4
        with:
          name: build-docs-test
          path: modm-api-docs.tar.gz
      - name: Build Homepage
        if: always()
        run: |
          python3 tools/scripts/synchronize_docs.py
          python3 tools/scripts/generate_module_docs.py
          cat docs/mkdocs.yml
          ls -l docs/src/reference
          ls -l docs/src/reference/config
          ls -l docs/src/reference/module
          (cd docs && mkdocs build)
      - name: Upload Homepage Documentation
        uses: actions/upload-artifact@v4
        with:
          name: build-homepage-test
          path: docs/modm.dev
      # FIXME: Allow localhost:port to work with Docker
      # - name: Check Homepage
      #   run: |
      #     apt install -y nodejs npm
      #     npm install -g broken-link-checker-local
      #     blcl modm/docs/modm.io/docs -ro --host-requests 100 --filter-level 1
